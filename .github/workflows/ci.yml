name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vshow
          POSTGRES_PASSWORD: ci-only-throwaway
          POSTGRES_DB: vshow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vshow" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # Disposable service container only. Never point CI at Neon or any shared database.
      DB_TARGET: local
      DATABASE_URL: postgresql://vshow:ci-only-throwaway@127.0.0.1:5432/vshow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
